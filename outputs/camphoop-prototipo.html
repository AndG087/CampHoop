r:#839087">Progresso · 68%　·　Revisão em 12 nov</small></div>`}

function tactics(){return head('Quadro tático','Desenhe jogadas e organize a escalação em tempo real.',btn('Salvar jogada','btn lime',"toast('Jogada salva no caderno')"))+`<div class="grid cols2"><div><div class="court-tools"><button onclick="tool('Mover')">↖ Mover</button><button onclick="tool('Seta')">↗ Seta</button><button onclick="tool('Passe')">┄ Passe</button><button onclick="tool('Bola')">● Bola</button><button onclick="tool('Apagar')">⌫ Apagar</button><button onclick="resetCourt()">↺ Limpar</button></div><div class="court" id="court"><div class="circle"></div><div class="key"></div><div class="player-dot home" style="left:48%;top:19%" draggable="true">08</div><div class="player-dot home" style="left:31%;top:37%" draggable="true">12</div><div class="player-dot home" style="left:63%;top:37%" draggable="true">05</div><div class="player-dot home" style="left:39%;top:68%" draggable="true">23</div><div class="player-dot home" style="left:58%;top:72%" draggable="true">14</div><div class="player-dot ball" style="left:51%;top:25%" draggable="true"></div></div><div class="section-row"><h2>Jogada atual</h2><span class="pill" id="toolname">MOVER</span></div><div class="card" style="font-size:11px;color:#78817c">Arraste os atletas pela quadra para montar a formação. Selecione a ferramenta para desenhar movimentos.</div></div><div><div class="section-row" style="margin-top:0"><h2>Escalação</h2><button class="text-link">5 em quadra</button></div><div class="card">${players.slice(0,5).map(p=>`<div class="player"><div class="avatar">${p[2]}</div><div><b>${p[0]}</b><small>${p[1]}</small></div><span class="pill">QUADRA</span></div>`).join('')}</div><div class="section-row"><h2>Caderno de jogadas</h2><button class="text-link">+ Nova</button></div><div class="card">${[['01','Chifre alto','Ataque · Saída de tempo'],['02','Corte UCLA','Ataque · Linha de fundo'],['03','Zona 2–3','Defesa · Meia quadra']].map(x=>`<div class="player"><span class="tag">${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div><span class="num">↗</span></div>`).join('')}</div></div></div>`}
function login(){return `<div class="login"><div class="login-side"><div class="brand"><span class="brand-icon">◉</span><span>CampHoop<small>GAME ON. GROW TOGETHER.</small></span></div><div><div class="eyebrow" style="color:var(--green)">BASQUETE DE BASE, CONECTADO</div><h1>O jogo cresce com você.</h1><p>Um espaço para equipes, atletas e comunidades viverem o basquete com mais dados, conexão e propósito.</p></div><small style="color:#7f9288;font-size:10px">© 2025 CampHoop · Protótipo demonstrativo</small></div><div class="login-box"><form class="login-form" onsubmit="event.preventDefault();logged=true;go('Início')"><h2>Bem-vinda de volta</h2><p>Entre na sua conta CampHoop para continuar.</p><div class="field"><label>E-MAIL</label><input type="email" placeholder="voce@exemplo.com" value="marina@camphoop.com"></div><div class="field"><label>SENHA</label><input type="password" placeholder="Sua senha" value="camphoop"></div><div style="text-align:right;font-size:10px;color:#67756c">Esqueceu a senha?</div><button class="btn lime">Entrar →</button><div class="note">Ainda não tem conta? <b style="color:#38553e">Criar conta</b></div><div style="text-align:center;margin-top:35px"><button class="text-link" onclick="logged=true;go('Início')">Pular para demonstração →</button></div></form></div></div>`}
function toast(s){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#10221e;color:white;padding:12px 18px;border-radius:9px;font-size:12px;z-index:20;box-shadow:0 8px 24px #0002';document.body.append(e)}e.textContent=s;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2300)}
function go(p){current=p;render();window.scrollTo(0,0)}function render(){if(!logged){root.innerHTML=login();return}let f={'Início':home,'Times':teamsPage,'Time específico':teamDetail,'Agenda':schedule,'Campeonatos':championships,'Atletas':athletes,'Dados de atleta':athleteDetail,'Partida ao vivo':liveGame,'Quadro tático':tactics};root.innerHTML=shell((f[current]||home)())}function record(a){if(a==='+2')document.getElementById('score1').textContent=+document.getElementById('score1').textContent+2;if(a==='+3')document.getElementById('score1').textContent=+document.getElementById('score1').textContent+3;document.getElementById('lastAction').textContent='AGORA · 3º Q';document.getElementById('eventlog').textContent=`Luiza Martins · ${a==='FT'?'Lance livre':a==='+2'?'Cesta de 2 pontos':a==='+3'?'Cesta de 3 pontos':a==='↔'?'Substituição':a==='⚑'?'Falta':a==='×'?'Erro':a==='◎'?'Assistência':a==='↗'?'Rebote ofensivo':'Rebote defensivo'}`;toast('Ação registrada no placar')}function tab(el){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(el.textContent==='Box score')toast('Box score da partida selecionado');if(el.textContent==='Escalação')toast('Escalação em quadra selecionada');if(el.textContent==='Lances')toast('Lances registrados selecionados')}function tool(t){document.getElementById('toolname').textContent=t.toUpperCase();toast(`Ferramenta ${t} selecionada`)}function resetCourt(){go('Quadro tático')}function searchItems(v){if(v.length>2)toast(`Buscando “${v}” no CampHoop`)}render();
</script></body></html>
